name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. 2.10.1)'
        required: true
        type: string

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: adopt
          cache: maven

      - name: Build and package with Maven
        run: mvn -B clean package -DskipTests -DgenerateBackupPoms=false -Pmaster --file pom.xml

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@0be4916ad5f081d936eb5615aa35ce3f0949979c # v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: NnkaZPqQ
          name: ${{ github.event.release.name || inputs.tag }}
          version: ${{ github.event.release.tag_name || inputs.tag }}
          changelog: ${{ github.event.release.body }}
          loaders: |-
            paper
            spigot
          game-versions: |-
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.1
            26.1.1
            26.1.2
            26.2
          # Relative path: the action runs in a Docker container where the workspace is
          # mounted at /github/workspace, so an absolute github.workspace path fails.
          files: target/MagicCobblestoneGenerator-${{ github.event.release.tag_name || inputs.tag }}.jar

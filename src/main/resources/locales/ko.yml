          </gray><gray>생성기를 할당합니다.</gray>
        list: "<aqua>선택된 생성기:</aqua>"
        value: "<aqua>- [generator]</aqua>"
      remove_generator:
        name: "<white><bold>생성기 제거</bold></white>"
        description: |-
          <gray>이 번들에서
          </gray><gray>생성기를 제거합니다.</gray>
        list: "<aqua>선택된 생성기:</aqua>"
        value: "<aqua>- [generator]</aqua>"

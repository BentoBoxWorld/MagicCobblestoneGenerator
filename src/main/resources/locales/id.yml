        value: "<aqua>Paket: [bundle]</aqua>"
        overwritten: |-
          <red>Pemilik memiliki izin yang
          </red><red>menimpa paket.</red>
      owner_bundle:
        name: "<white><bold>Paket Pemilik</bold></white>"

        value: "<aqua>Max Generators: [number]</aqua>"
        overwritten: |-
          <red>Owner has a permission that
          </red><red>overwrites the generator count.</red>
      owner_max_generators:
        name: "<white><bold>Max Eigenaar Generators</bold></white>"

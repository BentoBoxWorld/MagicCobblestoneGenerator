          </red><red>overwrites working range.</red>
      owner_working_range:
        name: "<white><bold>Eigenaar Werkbereik</bold></white>"
        description: |-
          <gray>Working range for generators
          </gray><gray>for the current owner.
          </gray><gray>'0' means that owner range is

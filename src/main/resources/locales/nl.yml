          <aqua>Deze generator is </aqua><red>not ingezet.</red>
      add_material:
        name: "<white><bold>Materiaal Toevoegen</bold></white>"
        description: |-
          <gray>Add new material tot the
          </gray><gray>current material list.</gray>
      remove_material:
